# Render Blueprint: New > Blueprint > pick this repo. Creates the PACTA relay (WebSocket lockstep server).
services:
  - type: web
    name: pacta-relay
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: TOKEN_PEPPER
        generateValue: true
      - key: SUPABASE_URL          # optional: keeps registered names across restarts (see server/README.md)
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
